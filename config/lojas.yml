# =====================================================================
# Cadastro de lojas monitoradas — Comparativo de Preços de Móveis
# =====================================================================
# Campos:
#   id          identificador único (sem espaços)
#   nome        nome exibido no app
#   plataforma  wake | vtex | manual
#                 wake   -> páginas de categoria (Wake Commerce/Fbits); exige categorias_url
#                 vtex   -> coleta automática pela API pública de catálogo VTEX
#                 manual -> preços lidos de data/manual/<id>.csv (lojas sem e-commerce)
#   base_url    domínio da loja (somente plataforma vtex)
#   regiao      região usada no filtro do app
#   cidade      cidade da loja / do ponto de venda de referência
#   ativo       true/false — false = cadastrada, mas fora da coleta
#   validado    false = conector ainda não confirmado em execução real
#   observacao  texto livre
#
# IMPORTANTE: os conectores marcados com validado: false foram configurados
# com base na plataforma presumida da loja e precisam ser confirmados na
# primeira execução da coleta (ver aba "Pendências" do app).
# =====================================================================

lojas:
  - id: novomundo
    nome: Novo Mundo
    plataforma: wake
    base_url: https://www.novomundo.com.br
    regiao: Goiânia
    cidade: Goiânia/GO
    ativo: true
    validado: false
    max_paginas: 10
    observacao: Rede com sede em Goiânia. Preço do e-commerce (pode divergir da loja física). Plataforma Wake Commerce.
    categorias_url:
      Sofás: [/moveis/sala-de-estar/sofas/sofa-2-lugares, /moveis/sala-de-estar/sofas/sofa-3-lugares]
      Camas e Box: [/moveis/quarto/colchoes-e-box/base-cama-box-casal, /moveis/quarto/colchoes-e-box/base-cama-box-queen, /moveis/quarto/colchoes-e-box/base-cama-box-king, /moveis/quarto/colchoes-e-box/base-cama-box-solteiro]
      Colchões: [/moveis/quarto/colchoes-e-box/colchao-de-casal, /moveis/quarto/colchoes-e-box/colchao-queen, /moveis/quarto/colchoes-e-box/colchao-king, /moveis/quarto/colchoes-e-box/colchao-de-solteiro, /moveis/quarto/colchoes-e-box/colchao-espuma]
      Guarda-roupas: [/moveis/guarda-roupa]
      Mesas de jantar: [/moveis/sala-de-jantar/conjunto-de-mesas-e-cadeiras, /moveis/cozinha/conjunto-de-mesas-e-cadeiras-de-cozinha]
      Racks e Painéis: [/moveis/sala-de-estar/paineis-para-tv]
      Cozinhas: [/moveis/cozinha/cozinha-compacta, /moveis/cozinha/cozinha-completa, /moveis/cozinha/kit-cozinha, /moveis/cozinha/balcoes]

  - id: tokstok
    nome: Tok&Stok
    plataforma: vtex
    base_url: https://www.tokstok.com.br
    regiao: Goiânia
    cidade: Goiânia/GO
    ativo: false
    validado: false
    observacao: "Desativada em 08/11/2026: APIs VTEX retornaram 404 — site não é VTEX. [conector próprio necessário]"

  - id: gazin
    nome: Gazin
    plataforma: vtex
    base_url: https://www.gazin.com.br
    regiao: Interior de GO
    cidade: "[confirmar cidade de referência]"
    ativo: false
    validado: false
    observacao: "Desativada em 08/11/2026: APIs VTEX retornaram 404 — site não é VTEX. [conector próprio necessário]"

  # Exemplo de loja física sem e-commerce: preencher data/manual/exemplo_local.csv
  - id: exemplo_local
    nome: "[Loja local — exemplo]"
    plataforma: manual
    regiao: Aparecida de Goiânia
    cidade: Aparecida de Goiânia/GO
    ativo: false
    validado: false
    observacao: Modelo para lojas de bairro. Ative após preencher o CSV.

# Termos de busca -> categoria do app.
# Cada termo é pesquisado em todas as lojas VTEX ativas.
categorias:
  Sofás: ["sofa", "sofa retratil", "sofa cama"]
  Camas e Box: ["cama box", "cama casal", "cama solteiro"]
  Colchões: ["colchao casal", "colchao queen"]
  Guarda-roupas: ["guarda roupa", "guarda-roupa casal"]
  Mesas de jantar: ["mesa de jantar", "conjunto sala de jantar"]
  Cadeiras: ["cadeira de jantar", "cadeira escritorio"]
  Racks e Painéis: ["rack", "painel para tv"]
  Cozinhas: ["cozinha compacta", "armario de cozinha"]
  Escrivaninhas: ["escrivaninha", "mesa escritorio"]

coleta:
  itens_por_termo: 100      # limite de produtos por termo e loja (VTEX: máx. 50 por página)
  pausa_segundos: 1.0       # intervalo entre requisições (cortesia com o servidor da loja)
  timeout_segundos: 30
